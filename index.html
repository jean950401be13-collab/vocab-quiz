<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字大師 - 互動式學習遊戲</title>
    <style>
        :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f7f5;font-size:18px;--primary:#285c50;--secondary:#16805b;--accent:#a86a00;--danger:#b42318}
        *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(135deg,#edf8f1,#f4f5fb);font-size:1rem;line-height:1.5} button,textarea,select,input{font:inherit} button{min-height:48px;cursor:pointer} button:disabled{cursor:not-allowed;opacity:.7}
        header{position:sticky;top:0;z-index:4;background:var(--primary);color:white;padding:12px 16px;box-shadow:0 3px 12px #10251d26} header>div{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px} h1{font-size:1.45rem;margin:0} main{width:min(900px,100%);margin:24px auto;padding:0 16px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
        .glass-panel{width:100%;padding:clamp(18px,4vw,34px);background:#fff;border:1px solid #d7e2dc;border-radius:22px;box-shadow:0 12px 34px #193e2b14}.hidden{display:none!important} .glass-panel h2{font-size:1.45rem;margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid #dce6e0}
        label{font-weight:700} textarea,select,input[type=text]{width:100%;padding:14px;border:2px solid #bac9c1;border-radius:12px;background:#fff} textarea{resize:vertical;min-height:160px} :focus-visible{outline:3px solid #edb94b;outline-offset:2px}
        #setup-screen>div{margin-bottom:22px}.quiz-launch{padding:10px 16px;border:1px solid #b9c9c0;border-radius:10px;background:#f5faf7;color:#17382f;font-weight:700} #setup-screen>div>label{display:block;margin-bottom:8px} #setup-screen>div>div:not(.grid){padding:12px;background:#fff8df;border-radius:10px;margin-bottom:10px} #setup-screen .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} #setup-screen label.cursor-pointer{display:block;border:2px solid #dce5e0;border-radius:14px;padding:14px;min-height:90px;cursor:pointer} #setup-screen label.cursor-pointer:has(input:checked){border-color:var(--primary);background:#edf7f2} #setup-screen input[type=radio]{accent-color:var(--primary);width:22px;height:22px;vertical-align:middle;margin-right:8px} #setup-screen h3{margin:4px 0;font-size:1.05rem} #setup-screen p{margin:0;color:#5c6870}
        .bg-primary,#btn-start,.bg-secondary{background:var(--primary);color:#fff;border:0} .bg-secondary{background:var(--secondary)} #btn-start{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:1.2rem} #nav-back-btn,.bg-gray-200{padding:10px 16px;border:0;border-radius:12px;background:#fff;color:var(--primary);font-weight:700}
        #game-header{margin-bottom:18px} #game-container{width:100%;min-height:300px} #game-container button{border-radius:12px} #game-container input{min-height:56px} .match-card{cursor:pointer} .match-card.selected{background:#fff2cd;border-color:#bd7800}.match-card.matched{background:#d9f4e5;opacity:.55}.animate-pop{animation:pop .3s ease-in-out}
        #result-screen{text-align:center} #result-screen button{padding:12px 20px;border:0;border-radius:12px;font-weight:700} #mistakes-list{padding:0;list-style:none} #mistakes-list li{margin:8px 0}
        #quiz-screen .quiz-tools{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0} #quiz-screen button{padding:10px 16px;border:1px solid #b9c9c0;border-radius:10px;background:#f5faf7;color:#17382f;font-weight:700} #quiz-screen .quiz-question{padding:16px 0;border-bottom:1px solid #dbe4df;break-inside:avoid} #quiz-screen .quiz-question strong{display:block;font-size:1.12rem;margin-bottom:8px} #quiz-screen .quiz-choice{display:block;text-align:left;width:100%;margin:6px 0;background:#fff!important} #quiz-score{font-weight:800;font-size:1.2rem;color:var(--primary)} #quiz-mistakes{padding-left:24px}
        .print-only{display:none}[hidden]{display:none!important}.letter-filter{margin:12px 0;padding:12px;border:2px solid #dce5e0;border-radius:14px;background:#fff}.lf-title{display:block;font-weight:700;margin-bottom:8px}.lf-count{color:#17603f;margin-left:6px}.lf-modes{display:flex;flex-wrap:wrap;gap:8px}.lf-modes label,.letter-pick label{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;border:1px solid #cfdcd5;border-radius:10px;font-size:1.05rem}.lf-range{margin:10px 0;font-size:1.1rem}.lf-range select{font-size:1.1rem;min-height:48px;min-width:72px;margin:0 6px}.letter-filter:not(:has(input[value=pick]:checked)) .letter-pick{display:none}.letter-filter:not(:has(input[value=range]:checked)) .lf-range{display:none}.letter-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.letter-pick label{justify-content:center;padding:0}.letter-pick input,.lf-modes input{width:22px;height:22px}.bank-status{margin:10px 0;font-weight:700;color:#17603f}#btn-restore-default{min-height:48px;font-size:1rem}.quiz-tools label{display:flex;align-items:center;gap:7px;padding:8px}.quiz-tools input{width:22px;height:22px}.border-danger{border-color:var(--danger)!important}button{transition:filter .15s,transform .15s}button:hover:not(:disabled){filter:brightness(.96)}.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-center{justify-content:center}.justify-between{justify-content:space-between}.w-full{width:100%}.grid{display:grid}.grid-cols-1{grid-template-columns:1fr}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.gap-3{gap:12px}.gap-4{gap:16px}.text-center{text-align:center}.text-left{text-align:left}.font-bold,.font-extrabold{font-weight:700}.text-xl{font-size:1.2rem}.text-2xl{font-size:1.4rem}.text-3xl{font-size:1.8rem}.text-4xl{font-size:2.1rem}.text-5xl{font-size:2.5rem}.p-4{padding:16px}.p-6{padding:24px}.p-8{padding:32px}.py-4{padding-top:16px;padding-bottom:16px}.px-6{padding-left:24px;padding-right:24px}.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}.mt-4{margin-top:16px}.rounded-xl{border-radius:14px}.border-2{border:2px solid #dce5e0}.bg-white{background:#fff}.shadow-sm{box-shadow:0 2px 8px #162b2010}.text-gray-500{color:#5c6870}.text-gray-700{color:#34423b}.text-gray-800{color:#172033}.min-h-screen{min-height:100vh}.flex-grow{flex-grow:1}.resize-none{resize:vertical}.max-w-2xl{max-width:672px}.max-w-md{max-width:448px}.mx-auto{margin-left:auto;margin-right:auto}.block{display:block}.peer:checked+.peer-checked\:bg-primary\/5{background:#edf7f2}
        @media(max-width:640px){.md\:grid-cols-2{grid-template-columns:1fr}.md\:w-1\/2{width:100%}main{margin:14px auto;padding:0 12px 24px}header{padding:10px 12px}h1{font-size:1.2rem}#setup-screen .grid{grid-template-columns:1fr}.glass-panel{border-radius:16px}#game-container{min-height:240px}}
        @media print{body{background:white!important;color:#111;font-size:12pt}body.print-exam #setup-screen,body.print-exam #game-screen,body.print-exam #result-screen,body.print-exam header,body.print-exam #quiz-tools,body.print-exam #quiz-score,body.print-exam #quiz-mistakes,body.print-key #setup-screen,body.print-key #game-screen,body.print-key #result-screen,body.print-key header,body.print-key #quiz-tools{display:none!important}body.print-exam #quiz-screen,body.print-key #quiz-screen{display:block!important;box-shadow:none;border:0;padding:0}body.print-exam .print-only,body.print-key .print-only{display:block}body.print-exam .answer-key{display:none!important}body.print-exam .answer-line{display:block;margin-top:28px;border-bottom:1px solid #555;height:16px}body.print-exam #quiz-screen[data-type="choice"] .answer-line{display:none!important}body.print-exam #quiz-screen[data-type="choice"] .quiz-choice{display:block!important;border:0!important;padding:0;margin:0;background:none!important}body.print-exam #quiz-screen[data-type="choice"] .quiz-choice input{display:none!important}body.print-key .answer-line,body.print-key .quiz-choice{display:none!important}body.print-key .answer-key{display:block!important}#quiz-screen .quiz-question{padding:12px 0;break-inside:avoid}}
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 答對時的彈跳動畫 */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.3s ease-in-out;
        }

        /* 配對卡片樣式 */
        .match-card {
            transition: all 0.2s;
            cursor: pointer;
        }
        .match-card.selected {
            background-color: #FEF3C7;
            border-color: #F59E0B;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .match-card.matched {
            background-color: #D1FAE5;
            border-color: #10B981;
            color: #065F46;
            opacity: 0.5;
            cursor: default;
            transform: scale(0.95);
        }

        /* 隱藏元素 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col antialiased">

    <header class="w-full bg-primary text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-extrabold tracking-wider">英文單字大師</h1>
            <button id="nav-back-btn" class="hidden text-sm bg-white text-primary px-4 py-2 rounded-full font-bold hover:bg-gray-100 transition shadow">
                 回設定
            </button>
        </div>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto p-4 md:p-6 flex flex-col items-center justify-center">

        <!-- ================= SETUP SCREEN ================= -->
        <div id="setup-screen" class="glass-panel w-full p-6 md:p-8 w-full animate-pop">
            <h2 class="text-xl md:text-2xl font-bold text-gray-700 mb-4 border-b pb-2">建立新測驗</h2>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">請輸入單字清單 (格式: 英文 = 中文)</label>
                <div class="bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm p-3 rounded-lg mb-3">
                     範例：<br>
                    apple = 蘋果<br>
                    banana = 香蕉
                </div>
                <textarea id="word-input" rows="8" class="w-full p-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-lg font-mono transition resize-none shadow-inner" placeholder="留空＝使用內建預設單字庫。可貼上自己的單字（每行一個）：&#10;apple = 蘋果&#10;abandon v. 放棄&#10;banana = 香蕉&#10;orange = 柳橙&#10;grape = 葡萄"></textarea>
                <div id="letter-filter" class="letter-filter"><label class="lf-title">抽題字母範圍 <span id="letter-count" class="lf-count"></span></label>
                <div class="lf-modes"><label><input type="radio" name="letter-mode" value="all" checked> 全部</label><label><input type="radio" name="letter-mode" value="range"> 從…到…</label><label><input type="radio" name="letter-mode" value="pick"> 自選字母</label></div>
                <div class="lf-range">從 <select id="letter-from"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option><option value="H">H</option><option value="I">I</option><option value="J">J</option><option value="K">K</option><option value="L">L</option><option value="M">M</option><option value="N">N</option><option value="O">O</option><option value="P">P</option><option value="Q">Q</option><option value="R">R</option><option value="S">S</option><option value="T">T</option><option value="U">U</option><option value="V">V</option><option value="W">W</option><option value="X">X</option><option value="Y">Y</option><option value="Z">Z</option></select> 到 <select id="letter-to"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option><option value="F">F</option><option value="G">G</option><option value="H">H</option><option value="I">I</option><option value="J">J</option><option value="K">K</option><option value="L">L</option><option value="M">M</option><option value="N">N</option><option value="O">O</option><option value="P">P</option><option value="Q">Q</option><option value="R">R</option><option value="S">S</option><option value="T">T</option><option value="U">U</option><option value="V">V</option><option value="W">W</option><option value="X">X</option><option value="Y">Y</option><option value="Z" selected>Z</option></select></div>
                <div class="letter-pick"><label><input type="checkbox" value="A">A</label><label><input type="checkbox" value="B">B</label><label><input type="checkbox" value="C">C</label><label><input type="checkbox" value="D">D</label><label><input type="checkbox" value="E">E</label><label><input type="checkbox" value="F">F</label><label><input type="checkbox" value="G">G</label><label><input type="checkbox" value="H">H</label><label><input type="checkbox" value="I">I</label><label><input type="checkbox" value="J">J</label><label><input type="checkbox" value="K">K</label><label><input type="checkbox" value="L">L</label><label><input type="checkbox" value="M">M</label><label><input type="checkbox" value="N">N</label><label><input type="checkbox" value="O">O</label><label><input type="checkbox" value="P">P</label><label><input type="checkbox" value="Q">Q</label><label><input type="checkbox" value="R">R</label><label><input type="checkbox" value="S">S</label><label><input type="checkbox" value="T">T</label><label><input type="checkbox" value="U">U</label><label><input type="checkbox" value="V">V</label><label><input type="checkbox" value="W">W</label><label><input type="checkbox" value="X">X</label><label><input type="checkbox" value="Y">Y</label><label><input type="checkbox" value="Z">Z</label></div></div>
                <p id="bank-status" class="bank-status"></p><button id="btn-restore-default" type="button" class="quiz-launch">恢復預設單字庫</button>
                <p id="word-count-error" class="text-danger text-sm mt-2 hidden font-bold"> 請至少輸入 4 個有效的單字組合！</p>
            </div>

            <div class="mb-6"><label>隨機 30 題測驗</label><p>從單字庫抽取最多 30 題，可選中翻英或英選中，並列印試卷與答案卷。</p><button id="btn-quiz" class="quiz-launch" type="button">📝 開始隨機 30 題測驗</button></div>

            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2"> 選擇測驗題數</label>
                <select id="question-limit" class="w-full md:w-1/2 p-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-lg font-bold text-gray-700 shadow-sm transition">
                    <option value="0">全部單字 (依輸入數量)</option>
                    <option value="5">隨機 5 題</option>
                    <option value="10">隨機 10 題</option>
                    <option value="20">隨機 20 題</option>
                </select>
            </div>

            <div class="mb-8">
                <label class="block text-gray-700 font-bold mb-3">選擇遊戲模式</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Mode 1: Multiple Choice -->
                    <label class="cursor-pointer">
                        <input type="radio" name="game-mode" value="choice" class="peer hidden" checked>
                        <div class="border-2 border-gray-200 rounded-xl p-4 peer-checked:border-primary peer-checked:bg-primary/5 hover:border-primary/50 transition flex items-center">
                            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl mr-4 shadow-sm">
                                
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">單字選擇題</h3>
                                <p class="text-sm text-gray-500">看中文選出正確的英文單字</p>
                            </div>
                        </div>
                    </label>
                    
                    <!-- Mode 2: Matching -->
                    <label class="cursor-pointer">
                        <input type="radio" name="game-mode" value="match" class="peer hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 peer-checked:border-primary peer-checked:bg-primary/5 hover:border-primary/50 transition flex items-center">
                            <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-xl mr-4 shadow-sm">
                                
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">中英配對</h3>
                                <p class="text-sm text-gray-500">將對應的中文與英文卡片連起</p>
                            </div>
                        </div>
                    </label>

                    <!-- Mode 3: Spelling -->
                    <label class="cursor-pointer">
                        <input type="radio" name="game-mode" value="spell" class="peer hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 peer-checked:border-primary peer-checked:bg-primary/5 hover:border-primary/50 transition flex items-center">
                            <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-xl mr-4 shadow-sm">
                                
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">拼字挑戰</h3>
                                <p class="text-sm text-gray-500">看中文提示，完整拼出單字</p>
                            </div>
                        </div>
                    </label>

                    <!-- Mode 4: Fill in the Blank -->
                    <label class="cursor-pointer">
                        <input type="radio" name="game-mode" value="blank" class="peer hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 peer-checked:border-primary peer-checked:bg-primary/5 hover:border-primary/50 transition flex items-center">
                            <div class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-xl mr-4 shadow-sm">
                                
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">填空題</h3>
                                <p class="text-sm text-gray-500">填入單字中遺漏的字母</p>
                            </div>
                        </div>
                    </label>

                    <label class="cursor-pointer">
                        <input type="radio" name="game-mode" value="listen" class="peer hidden">
                        <div class="border-2 border-gray-200 rounded-xl p-4 peer-checked:border-primary peer-checked:bg-primary/5 hover:border-primary/50 transition flex items-center">
                            <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center text-xl mr-4 shadow-sm">
                                
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">聽力測驗</h3>
                                <p class="text-sm text-gray-500">聆聽英文發音並選出正確中文</p>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <button id="btn-start" class="w-full bg-primary hover:bg-indigo-700 text-white font-bold text-xl py-4 rounded-xl shadow-lg transform transition hover:-translate-y-1 active:translate-y-0">
                 產生遊戲並開始！
            </button>
        </div>

        <section id="quiz-screen" class="glass-panel hidden" aria-live="polite">
            <h2>隨機 30 題測驗</h2>
            <div id="quiz-tools" class="quiz-tools">
                <label><input type="radio" name="quiz-type" value="translate" checked> 中翻英</label>
                <label><input type="radio" name="quiz-type" value="choice"> 英選中</label>
                <button id="quiz-redraw" type="button">重新抽題</button><button id="quiz-submit" type="button">交卷</button>
                <button id="quiz-print-exam" type="button">列印試卷</button><button id="quiz-print-key" type="button">列印答案卷</button>
                <button id="quiz-back" type="button">回設定</button>
            </div>
            <div id="quiz-score" class="hidden"></div><ol id="quiz-questions"></ol><div id="quiz-mistakes" class="hidden"></div>
        </section>

        <!-- ================= GAME SCREEN ================= -->
        <div id="game-screen" class="glass-panel w-full p-6 md:p-8 w-full hidden flex-col">
            
            <!-- Game Header (Progress & Score) -->
            <div id="game-header" class="flex flex-col mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span id="progress-text" class="text-gray-500 font-bold">第 1 / 10 題</span>
                    <div class="bg-yellow-100 text-yellow-700 px-4 py-1 rounded-full font-extrabold flex items-center shadow-sm">
                         分數: <span id="score-display" class="ml-2 text-xl">0</span>
                    </div>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 rounded-full h-3 mb-4 shadow-inner overflow-hidden">
                    <div id="progress-bar" class="bg-secondary h-3 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- Dynamic Game Container -->
            <div id="game-container" class="flex-grow flex flex-col items-center justify-center min-h-[300px] w-full">
                <!-- Content injected via JS -->
            </div>
            
            <!-- Feedback overlay/area -->
            <div id="feedback-area" class="h-12 mt-4 flex items-center justify-center text-xl font-bold opacity-0 transition-opacity">
                <!-- Correct/Wrong text -->
            </div>
            
            <!-- Next Button for non-auto advancing modes -->
            <button id="btn-next" class="hidden mt-4 w-full md:w-auto md:px-12 bg-primary hover:bg-indigo-700 text-white font-bold text-lg py-3 rounded-xl shadow-md transition mx-auto block">
                下一題 
            </button>

        </div>

        <!-- ================= RESULT SCREEN ================= -->
        <div id="result-screen" class="glass-panel w-full p-8 md:p-12 w-full hidden text-center">
            <div class="text-6xl text-accent mb-4 animate-bounce">
                
            </div>
            <h2 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-2">測驗完成！</h2>
            <p class="text-gray-500 text-lg mb-8">太棒了，你完成了所有挑戰！</p>

            const rawText = wordInput.value;

            const badLines = [];
            const NEWFMT = /^\s*(.+?)\s+((?:[a-z]+\.\s*(?:\/|&|,)?\s*)+)\s*(\S.*?)\s*$/;
            lines.forEach(line => {
                if (line.includes('=')) {
                    const idx = line.indexOf('=');
                    let en = line.slice(0, idx).trim(), tw = line.slice(idx + 1).trim(), pos = '';
                    const pm = en.match(/^(.+?)\s+((?:[a-z]+\.\s*\/?\s*)+)$/);
                    if (pm) { en = pm[1].trim(); pos = pm[2].replace(/\s+/g, ''); }
                    if (en && tw) masterVocabList.push({ en, pos, tw });
                } else if (line.trim()) {
                    const m = line.match(NEWFMT);
                    if (m) masterVocabList.push({ en: m[1].replace(/\s+/g, ' '), pos: m[2].replace(/\s+/g, ''), tw: m[3].trim() });
                    else badLines.push(line.trim());

        function handleMatchClick(cardElement, item) {
            // Ignore if already matched or selected
            if (cardElement.classList.contains('matched') || cardElement.classList.contains('selected')) {
                return;
            }

            cardElement.classList.add('selected');

            if (!firstSelectedCard) {
                // First pick
                firstSelectedCard = { el: cardElement, data: item };
            } else {
                // Second pick
                matchingAttempts++;
                const secondItem = item;
                const firstEl = firstSelectedCard.el;
                const secondEl = cardElement;

                // Check match
                if (firstSelectedCard.data.id === secondItem.id && firstSelectedCard.data.type !== secondItem.type) {
                    // Match Correct!
                    playCorrectSound();
                    setTimeout(() => {
                        firstEl.classList.remove('selected');
                        secondEl.classList.remove('selected');
                        firstEl.classList.add('matched', 'animate-pop');
                        secondEl.classList.add('matched', 'animate-pop');
                        
                        matchedPairs++;

                        let pairsToPlay = Math.min(vocabList.length, 8);

                    if (w2 && !mistakes.some(m => m.en === w2.en)) mistakes.push(w2);

                    score = Math.max(0, score - 5); // Penalty
                    document.getElementById('match-score').innerText = score;

                    setTimeout(() => {
                        firstEl.classList.remove('selected', 'animate-shake', 'bg-red-100', 'border-red-400');
                        secondEl.classList.remove('selected', 'animate-shake', 'bg-red-100', 'border-red-400');

            }

            let inputs = [];

            for (let i = 0; i < word.length; i++) {
                const char = word[i];
                if (char === ' ') {
                    // Space handle
                    const space = document.createElement('div');
                    space.className = 'w-4 md:w-6';
                    wordContainer.appendChild(space);
                    inputs.push(null);
                } else if (hideIndices.includes(i)) {
                    // Blank input
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.maxLength = 1;
                    inp.dataset.correct = normAns(char);
                    inp.className = 'w-10 h-12 md:w-14 md:h-16 text-center text-2xl md:text-3xl font-bold font-mono border-b-4 border-gray-400 bg-gray-50 focus:outline-none focus:border-primary focus:bg-white uppercase transition shadow-sm rounded-t-md';
                    
                    // Auto move focus logic
                    inp.addEventListener('input', function(e) {
                        this.value = this.value.toUpperCase();
                        if (this.value) {
                            // Find next empty input
                            let currentIndex = inputs.indexOf(this);
                            for (let j = currentIndex + 1; j < inputs.length; j++) {
                                if (inputs[j] && !inputs[j].value) {
                                    inputs[j].focus();
                                    break;
                                }
                            }
                        }
                        checkAllFilled();
                    });

                    // Backspace logic to move left
                    inp.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && !this.value) {
                            let currentIndex = inputs.indexOf(this);
                            for (let j = currentIndex - 1; j >= 0; j--) {
                                if (inputs[j]) {
                                    inputs[j].focus();
                                    break;
                                }
                            }
                        } else if (e.key === 'Enter') {
                            submitBlankAnswer();
                        }
                    });

                    wordContainer.appendChild(inp);
                    inputs.push(inp);
                } else {
                    // Visible character
                    const span = document.createElement('div');
                    span.className = 'w-10 h-12 md:w-14 md:h-16 flex items-center justify-center text-2xl md:text-3xl font-bold font-mono border-b-4 border-gray-800 text-gray-800 uppercase';
                    span.innerText = char;
                    wordContainer.appendChild(span);
                    inputs.push(null); // Placeholder for alignment
                }
            }

            gameContainer.appendChild(wordContainer);

            // Check Answer Button
            const checkBtn = document.createElement('button');
            checkBtn.className = 'mt-4 w-full max-w-xs bg-primary hover:bg-indigo-700 text-white font-bold text-xl py-3 rounded-xl shadow transition hidden';
            checkBtn.innerText = '確認答案';
            gameContainer.appendChild(checkBtn);

            function checkAllFilled() {
                let allFilled = inputs.filter(i => i !== null).every(i => i.value !== '');
                if (allFilled) {
                    checkBtn.classList.remove('hidden');
                } else {
                    checkBtn.classList.add('hidden');
                }
            }

            const submitBlankAnswer = () => {
                let isCorrect = true;
                let activeInputs = inputs.filter(i => i !== null);
                
                activeInputs.forEach(inp => {
                    inp.disabled = true;
                    if (normAns(inp.value) === inp.dataset.correct) {
                        inp.classList.add('border-green-500', 'text-green-600', 'bg-green-50');
                    } else {
                        isCorrect = false;
                        inp.classList.add('border-red-500', 'text-red-600', 'bg-red-50');
                    }
                });
                checkBtn.disabled = true;

                if (isCorrect) {
                    handleCorrect();
                } else {
                    wordContainer.classList.add('animate-shake');
                    handleWrong(currentVocab.en);
                }
            };

            checkBtn.onclick = submitBlankAnswer;

            // Focus first input
            let firstInput = inputs.find(i => i !== null);
            if(firstInput) setTimeout(() => firstInput.focus(), 100);
        }

        function renderListeningMode() {
            const currentVocab = vocabList[currentQuestionIndex];
            
            // 語音播放區塊
            const audioDiv = document.createElement('div');
            audioDiv.className = 'mb-8 text-center animate-pop w-full flex flex-col items-center';
            
            const playBtn = document.createElement('button');
            playBtn.className = 'w-24 h-24 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center text-4xl shadow-lg hover:bg-teal-200 hover:scale-105 transition active:scale-95 border-4 border-teal-500 relative';
            playBtn.innerHTML = '';
            
            const hintText = document.createElement('p');
            hintText.className = 'text-gray-500 font-bold mt-4 tracking-wider';
            hintText.innerText = '點擊聆聽單字發音';

            const playAudio = () => {
                const utterThis = new SpeechSynthesisUtterance(currentVocab.en);
                utterThis.lang = 'en-US'; 
                utterThis.rate = 0.85; // 稍微放慢語速以利聽寫
                window.speechSynthesis.speak(utterThis);
                
                // 按鈕閃爍特效
                playBtn.classList.add('ring-4', 'ring-teal-300', 'ring-opacity-50');
                setTimeout(() => playBtn.classList.remove('ring-4', 'ring-teal-300', 'ring-opacity-50'), 500);
            };

            playBtn.onclick = playAudio;
            audioDiv.appendChild(playBtn);
            audioDiv.appendChild(hintText);
            gameContainer.appendChild(audioDiv);

            // 產生中文選項
            let options = [currentVocab];
            let otherVocabs = masterVocabList.filter(v => v.en !== currentVocab.en);
            shuffleArray(otherVocabs);
            
            for(let i=0; i<3 && i<otherVocabs.length; i++) {
                options.push(otherVocabs[i]);
            }
            shuffleArray(options);

            const optionsGrid = document.createElement('div');
            optionsGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-2 border-gray-200 hover:border-teal-500 hover:bg-teal-50 text-gray-700 text-xl font-bold py-4 px-6 rounded-xl shadow-sm transition transform hover:scale-105 active:scale-95';
                btn.innerText = twp(opt); // 選項顯示中文
                
                btn.onclick = () => {
                    Array.from(optionsGrid.children).forEach(b => {
                        b.disabled = true;
                        b.classList.remove('hover:border-teal-500', 'hover:bg-teal-50', 'hover:scale-105', 'active:scale-95');
                    });

                    if (opt.en === currentVocab.en) {
                        btn.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                        btn.innerHTML += ' ';
                        handleCorrect();
                    } else {
                        btn.classList.add('bg-red-100', 'border-red-500', 'text-red-700', 'animate-shake');
                        btn.innerHTML += ' ';
                        
                        // 標示正確答案
                        Array.from(optionsGrid.children).forEach(b => {
                            if(b.innerText === twp(currentVocab)) {
                                b.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                            }
                        });
                        handleWrong(currentVocab.en);
                    }
                };
                optionsGrid.appendChild(btn);
            });

            gameContainer.appendChild(optionsGrid);

            // 進入題目時自動播放一次語音
            setTimeout(playAudio, 300);
        }

        function handleCorrect() {
            playCorrectSound();
            score += 10;
            correctCount++;
            updateScoreDisplay();
            showFeedback(true);
            setTimeout(showNextButton, 600);
        }

        function handleWrong(correctAnswer) {
            playWrongSound();
            wrongCount++;
            
            // 將錯題記錄到 mistakes 陣列中
            let wrongVocab = masterVocabList.find(v => v.en === correctAnswer);
            if (wrongVocab && !mistakes.some(m => m.en === wrongVocab.en)) {
                mistakes.push(wrongVocab);
            }

            showFeedback(false, correctAnswer);
            setTimeout(showNextButton, 1000);
        }

        function updateScoreDisplay() {
            scoreDisplay.innerText = score;
            // Add a little pop effect to score
            scoreDisplay.classList.remove('animate-pop');
            void scoreDisplay.offsetWidth; // trigger reflow
            scoreDisplay.classList.add('animate-pop');
        }

        function showFeedback(isCorrect, correctAnswer = '') {
            feedbackArea.className = 'h-16 mt-4 flex items-center justify-center text-xl font-bold rounded-xl w-full max-w-lg mx-auto transition-all duration-300';
            
            if (isCorrect) {
                feedbackArea.classList.add('bg-green-100', 'text-green-700', 'border', 'border-green-300', 'animate-pop');
                feedbackArea.innerHTML = ' 答對了！太棒了！';
            } else {
                feedbackArea.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-300');
                feedbackArea.innerHTML = ` 答錯了！正確答案是: <span class="ml-2 bg-white px-3 py-1 rounded shadow-sm text-red-600 tracking-wider font-mono">${correctAnswer}</span>`;
            }
        }

        function clearFeedback() {
            feedbackArea.className = 'h-16 mt-4 flex items-center justify-center opacity-0';
            feedbackArea.innerHTML = '';
        }

        function showNextButton() {
            btnNext.classList.remove('hidden');
            // Auto focus next button for fast keyboard navigation
            btnNext.focus();
        }

        function endGame() {
            gameScreen.classList.add('hidden');
            navBackBtn.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            // Calculate stats
            let total = currentGameMode === 'match' ? Math.min(vocabList.length, 8) : vocabList.length;
            let accuracy = 0;
            
            if (currentGameMode === 'match') {
                // Total attempts vs exact pairs
                if (matchingAttempts > 0) {
                    accuracy = Math.round((total / matchingAttempts) * 100);
                } else {
                    accuracy = 100; // Flawless or 0 pairs
                }
            } else {
                accuracy = Math.round((correctCount / total) * 100);
            }

            // Ensure valid percentage
            accuracy = Math.min(100, Math.max(0, accuracy));

            document.getElementById('final-score').innerText = score;
            
            // Add visual color to accuracy based on performance
            const accElement = document.getElementById('final-accuracy');
            accElement.innerText = `${accuracy}%`;
            accElement.className = 'text-4xl md:text-5xl font-black';
            if (accuracy >= 80) accElement.classList.add('text-green-500');
            else if (accuracy >= 60) accElement.classList.add('text-yellow-500');
            else accElement.classList.add('text-red-500');

            document.getElementById('stat-correct').innerText = correctCount;
            document.getElementById('stat-wrong').innerText = wrongCount;

            const mistakesSection = document.getElementById('mistakes-section');
            const mistakesList = document.getElementById('mistakes-list');
            mistakesList.innerHTML = ''; // 清空舊資料
            
            if (mistakes.length > 0) {
                mistakesSection.classList.remove('hidden');
                mistakes.forEach(m => {
                    const li = document.createElement('li');
                    li.className = 'bg-white p-3 rounded-lg shadow-sm border border-red-200 flex justify-between items-center';
                    li.innerHTML = `<span class="font-bold text-gray-800 text-xl tracking-wide">${enp(m)}</span> <span class="text-gray-600 font-bold">${m.tw}</span>`;
                    mistakesList.appendChild(li);
                });
            } else {
                mistakesSection.classList.add('hidden');
            }

            // Update Progress bar to 100% just in case
            progressBar.style.width = '100%';
        }
    </script>
</body>
